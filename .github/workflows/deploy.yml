name: CI/CD pptx2png

# Запуск при пуше в ветки test или main
on:
  push:
    branches:
      - test
      - main

# Разрешаем запись в репозиторий (для коммита логов)
permissions:
  contents: write

jobs:
  deploy-and-test:
    # Используем self-hosted раннер на Raspberry Pi
    runs-on: [self-hosted, raspberry]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- БЛОК ДЛЯ ТЕСТОВОЙ ВЕТКИ ---
      - name: Deploy and Test on Test Branch
        if: github.ref == 'refs/heads/test'
        run: |
          # 1. Синхронизация кода в тестовую директорию
          #    --delete удаляет файлы, которых больше нет в репозитории,
          #    исключаем конфиги и логи, чтобы сохранить локальные настройки.
          rsync -av --delete \
                --exclude='.git*' \
                --exclude='config*' \
                --exclude='allowed_users*' \
                --exclude='debug.log' \
                ./ /home/pi/app/pptx2png/test/
          
          # 2. Переходим в папку тестового бота
          cd /home/pi/app/pptx2png/test/
          
          # 3. Запускаем бота на 30 секунд для проверки работоспособности
          #    (таймаут гарантирует, что раннер не зависнет)
          timeout 30s /home/pi/.venv/bin/python3 bot.py > debug.log 2>&1 || true
          
          # 4. Копируем собранный лог в рабочую директорию GitHub Actions
          cp debug.log ${{ github.workspace }}/debug.log

      - name: Commit and Push Log to GitHub
        if: github.ref == 'refs/heads/test'
        run: |
          # Настраиваем git для коммита от имени раннера
          git config --global user.name "Raspberry Runner"
          git config --global user.email "runner@raspberry.local"
          
          # Проверяем, есть ли лог-файл
          if [ -f debug.log ]; then
            # Добавляем файл в индекс
            git add debug.log
            # Коммитим (если нет изменений — пропускаем)
            git commit -m "Chore: update debug.log [skip ci]" || echo "No changes to commit"
            # Подтягиваем последние изменения из удалённой ветки test,
            # чтобы избежать конфликтов при пуше
            git pull --rebase origin test || echo "Pull failed, continuing with push"
            # Пушим в удалённую ветку test
            git push origin test
          fi

      # --- БЛОК ДЛЯ ПРОДАКШН-ВЕТКИ (MAIN) ---
      - name: Deploy to Production Branch
        if: github.ref == 'refs/heads/main'
        run: |
          # 1. Синхронизация кода в продовскую директорию
          #    --delete удаляет устаревшие файлы, сохраняя только актуальные
          #    Исключаем конфиги и логи, чтобы не затереть локальные секреты
          rsync -av --delete \
                --exclude='.git*' \
                --exclude='config*' \
                --exclude='allowed_users*' \
                --exclude='debug.log' \
                ./ /home/pi/app/pptx2png/prod/
          
          # 2. Переходим в папку продакшн-бота
          cd /home/pi/app/pptx2png/prod/
          
          # 3. Даём права на выполнение manage.sh
          chmod +x manage.sh
          
          # 4. Перезапускаем бота (без маскировки ошибок!)
          #    Если restart вернёт ненулевой код, сборка прервётся.
          env RUNNER_TRACKING_ID=0 ./manage.sh restart
          
          # 5. Ждём пару секунд, чтобы процесс успел запуститься
          sleep 2
          
          # 6. Проверяем статус бота.
          #    Если manage.sh status вернёт 0 (бот работает) — успех.
          #    Иначе — помечаем шаг как неудачный и останавливаем сборку.
          if ./manage.sh status; then
            echo "✅ Production бот успешно запущен"
          else
            echo "❌ Не удалось запустить production бота"
            exit 1
          fi
