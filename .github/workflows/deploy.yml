name: CI/CD pptx2png (Test Branch Only)

on:
  push:
    branches:
      - test

permissions:
  contents: write

jobs:
  deploy-and-test:
    runs-on: [self-hosted, raspberry]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy and Test on Test Branch
        run: |
          # 1. Синхронизируем код, исключая локальные конфиги, вайтлисты и runtime-файлы
          rsync -av --exclude='.git*' --exclude='config*' --exclude='allowed_users*' --exclude='user_settings*' --exclude='.run_state*' ./ /home/pi/app/pptx2png/test/

          cd /home/pi/app/pptx2png/test/
          chmod +x manage.sh

          # 2. Останавливаем старую тестовую копию перед деплоем нового кода
          echo "⏹️ Остановка старого бота..."
          ./manage.sh stop || true

          # 3. Запускаем бота, отвязывая дескрипторы от сессии GitHub Runner
          echo "🚀 Запуск тестового бота через manage.sh..."
          export RUNNER_TRACKING_ID=0
          nohup ./manage.sh start

      - name: Verify bot is running
        run: |
          sleep 5
          cd /home/pi/app/pptx2png/test/
          if pgrep -f "python.*bot.py" > /dev/null; then
            echo "✅ Бот успешно запущен"
          else
            echo "❌ Бот не запущен, проверьте логи"
            exit 1
          fi
