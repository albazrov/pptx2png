name: CI/CD pptx2png (Production)

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy-prod:
    runs-on: [self-hosted, raspberry]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Production
        run: |
          # 1. Синхронизируем код в папку prod/
          rsync -av --delete --exclude='.git*' --exclude='config*' --exclude='allowed_users*' --exclude='user_settings*' --exclude='.run_state*' ./ /home/pi/app/pptx2png/prod/

          cd /home/pi/app/pptx2png/prod/
          chmod +x manage.sh

          # 2. Останавливаем старый продакшн-бот
          echo "⏹️ Остановка старого продакшн-бота..."
          ./manage.sh stop

          # 3. Запускаем новый продакшн-бот
          echo "🚀 Запуск продакшн-бота через manage.sh..."
          export RUNNER_TRACKING_ID=0
          nohup ./manage.sh start

      - name: Verify bot is running
        run: |
          cd /home/pi/app/pptx2png/prod/
          if ./manage.sh status; then
            echo "✅ Продакшн-бот успешно запущен"
          else
            echo "❌ Продакшн-бот не запущен, проверьте логи"
            exit 1
          fi
